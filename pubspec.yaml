name: agro_loupe
description: "Identifier les maladies des cultures à partir d'une photo de feuille, hors-ligne."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gestion d'état
  provider: ^6.1.5+1

  # Diagnostic hors-ligne : modèle embarqué + prétraitement de l'image
  tflite_flutter: ^0.12.1
  image: ^4.10.1

  # Prise de photo (caméra et galerie)
  image_picker: ^1.2.2

  # Stockage local : historique et réglages
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Fiches de traitement (Firestore, lecture seule, cache hors-ligne)
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

  # État de la connexion
  connectivity_plus: ^7.3.1

  # Clés d'API en développement, lues depuis .env (jamais commité).
  # Temporaire : à remplacer par Firebase AI Logic avant toute diffusion,
  # un .env est embarqué dans l'APK et s'en extrait en clair.
  flutter_dotenv: ^6.0.1
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/data/
    - .env
